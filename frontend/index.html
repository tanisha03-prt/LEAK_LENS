<!doctype html>
<html lang="en">
  <head>
    <script>
      // Ignore WebSocket / HMR errors per AI Studio environment constraints
      window.addEventListener('unhandledrejection', function (e) {
        var msg = (e && e.reason && (e.reason.message || e.reason.stack || String(e.reason))) || '';
        if (msg.includes('WebSocket') || msg.includes('vite:ws') || msg.includes('closed without opened')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = (e && (e.message || '')) || '';
        if (msg.includes('WebSocket') || msg.includes('vite:ws') || msg.includes('closed without opened')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
    </script>
